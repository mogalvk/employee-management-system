services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: employee
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio-local-only
      MYSQL_ROOT_PASSWORD: root-local-only
    ports: ["3309:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot-local-only"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/employee?serverTimezone=UTC
      DB_USER: portfolio
      DB_PASSWORD: portfolio-local-only
    ports: ["8083:8083"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
